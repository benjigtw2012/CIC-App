<!doctype html>
<html><head><meta charset="utf-8"><title>CIC App</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f7f9;color:#172033}.wrap{max-width:1350px;margin:auto;padding:20px}h1{margin:0;font-size:30px}.sub{color:#667085;margin:6px 0 18px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{background:white;border:1px solid #dde3ea;border-radius:16px;padding:16px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:12px}input,select,button{font:inherit}input,select{width:100%;padding:10px;border:1px solid #dde3ea;border-radius:10px}button{background:#0f766e;color:white;border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}button.grey{background:#eef2f6;color:#172033}button.red{background:#fff1f2;color:#be123c}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #dde3ea;vertical-align:top}th{background:#f2f4f7;text-align:left}.scroll{max-height:640px;overflow:auto;border:1px solid #dde3ea;border-radius:12px}.code{font-family:Consolas,monospace;font-size:12px}.muted{font-size:12px;color:#667085}.quoteTop{display:flex;justify-content:space-between;border-bottom:1px solid #dde3ea;margin-bottom:12px;padding-bottom:12px}.quoteNo{font-size:26px;font-weight:800}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.checks{display:flex;gap:16px;margin-bottom:12px}.checks input{width:auto}.qty{width:65px;text-align:center}.price{width:85px;text-align:right}.totals{margin-left:auto;max-width:360px}.totals div{display:flex;justify-content:space-between;padding:6px 0}.total{border-top:2px solid #dde3ea;font-size:22px;font-weight:800}@media(max-width:900px){.grid,.controls,.two{grid-template-columns:1fr}}@media print{.noPrint{display:none!important}.grid{display:block}.card{border:none}.wrap{padding:0}body{background:white}}
</style></head>
<body><div class="wrap">
<div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-end"><div><h1>CIC App</h1><div class="sub">Quote builder for Ronjack and Coodec products</div></div><div class="noPrint"><button onclick="window.print()">Print / Save PDF</button> <button class="grey" onclick="newQuote()">New Quote</button></div></div>
<div class="grid"><div class="card noPrint"><div class="controls"><input id="search" placeholder="Search code, product, colour..." oninput="renderProducts()"><select id="supplier" onchange="renderProducts()"></select><select id="category" onchange="renderProducts()"></select></div><div class="checks"><label><input id="useRrp" type="checkbox"> Add using RRP</label><label><input id="autoDelivery" type="checkbox" checked onchange="renderQuote()"> Auto delivery</label><label><input id="vat" type="checkbox" checked onchange="renderQuote()"> VAT 20%</label></div><div class="scroll"><table><thead><tr><th>Code</th><th>Product</th><th>Trade</th><th>RRP</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div></div>
<div class="card"><div class="quoteTop"><div><div class="muted">QUOTE</div><div class="quoteNo" id="quoteNo"></div><div class="sub">Guernsey Trade Windows Ltd</div></div><div class="muted" id="date"></div></div><div class="two"><label>Customer / project<input id="customer" placeholder="Customer name"></label><label>Prepared by<input id="prepared" value="Ben"></label></div><div style="overflow:auto;border:1px solid #dde3ea;border-radius:12px"><table><thead><tr><th>Item</th><th>Qty</th><th>Each</th><th style="text-align:right">Line</th><th class="noPrint"></th></tr></thead><tbody id="quoteRows"></tbody></table></div><div id="totals" class="totals"></div><p class="muted">Quote numbers auto-assign in this browser. Delivery: under 387kg £185, 386-616kg £145, 617-999kg £110, 1 tonne+ free.</p></div></div></div>
<script>
const PRODUCTS = [{"supplier": "Ronjack", "category": "Decking", "code": "RJDBCHOC", "name": "Deep Embossed Decking Board", "colour": "Chocolate", "size": "3600 x 145 x 25mm", "weight": 9.94, "unit": 15.75, "rrp": 22.05}, {"supplier": "Ronjack", "category": "Decking", "code": "RJDBCARA", "name": "Deep Embossed Decking Board", "colour": "Caramel", "size": "3600 x 145 x 25mm", "weight": 9.94, "unit": 15.75, "rrp": 22.05}, {"supplier": "Ronjack", "category": "Decking", "code": "RJDBSILVERA", "name": "Deep Embossed Decking Board", "colour": "Silver Ash", "size": "3600 x 145 x 25mm", "weight": 9.94, "unit": 15.75, "rrp": 22.05}, {"supplier": "Ronjack", "category": "Decking", "code": "RJDBSLATE", "name": "Deep Embossed Decking Board", "colour": "Slate", "size": "3600 x 145 x 25mm", "weight": 9.94, "unit": 15.75, "rrp": 22.05}, {"supplier": "Ronjack", "category": "Decking", "code": "RJDBTEAK", "name": "Deep Embossed Decking Board", "colour": "Teak", "size": "3600 x 145 x 25mm", "weight": 9.94, "unit": 15.75, "rrp": 22.05}, {"supplier": "Oakio", "category": "Decking", "code": "OAKDBAMBER", "name": "Oakio Iniwood Decking Board", "colour": "Amber", "size": "3600 x 147 x 21mm", "weight": 8.39, "unit": 16.6, "rrp": 23.24}, {"supplier": "Oakio", "category": "Decking", "code": "OAKDBDARKGREY", "name": "Oakio Iniwood Decking Board", "colour": "Dark Grey", "size": "3600 x 147 x 21mm", "weight": 8.39, "unit": 16.6, "rrp": 23.24}, {"supplier": "Oakio", "category": "Decking", "code": "OAKDBOAK", "name": "Oakio Iniwood Decking Board", "colour": "Oak", "size": "3600 x 147 x 21mm", "weight": 8.39, "unit": 16.6, "rrp": 23.24}, {"supplier": "Oakio", "category": "Decking", "code": "OAKDBWHITE", "name": "Oakio Iniwood Decking Board", "colour": "Smoke White", "size": "3600 x 147 x 21mm", "weight": 8.39, "unit": 16.6, "rrp": 23.24}, {"supplier": "Ronjack", "category": "Decking Accessory", "code": "RJTCLIP", "name": "T-Fixings", "colour": "", "size": "Bag of 200", "weight": 1.5, "unit": 24.5, "rrp": 34.3}, {"supplier": "Ronjack", "category": "Decking Accessory", "code": "RJJOIST", "name": "Plastic Joist", "colour": "Black", "size": "50 x 125 x 3600mm", "weight": 20.9, "unit": 24.17, "rrp": 33.84}, {"supplier": "Ronjack", "category": "Cladding", "code": "RJCLADCHOC", "name": "Deep Embossed Cladding Board", "colour": "Chocolate", "size": "3600 x 148 x 21mm", "weight": 6.012, "unit": 13.4, "rrp": 18.76}, {"supplier": "Ronjack", "category": "Cladding", "code": "RJCLADCARA", "name": "Deep Embossed Cladding Board", "colour": "Caramel", "size": "3600 x 148 x 21mm", "weight": 6.012, "unit": 13.4, "rrp": 18.76}, {"supplier": "Ronjack", "category": "Cladding", "code": "RJCLADSLATE", "name": "Deep Embossed Cladding Board", "colour": "Slate", "size": "3600 x 148 x 21mm", "weight": 6.012, "unit": 13.4, "rrp": 18.76}, {"supplier": "Ronjack", "category": "Cladding", "code": "RJSHADCEDAR", "name": "Ronjack Shadow Cladding", "colour": "Cedar", "size": "2800 x 219 x 26mm", "weight": 8.7, "unit": 17.5, "rrp": 24.5}, {"supplier": "Ronjack", "category": "Fencing", "code": "RJFENCECHOC", "name": "Deep Embossed Fencing Board", "colour": "Chocolate", "size": "1820 x 150 x 20mm", "weight": 6.012, "unit": 8.5, "rrp": 11.9}, {"supplier": "Ronjack", "category": "Fence Post", "code": "ALUPOST235", "name": "2350mm Aluminium Post", "colour": "Black", "size": "80 x 80mm", "weight": 6.8, "unit": 47.25, "rrp": 66.15}, {"supplier": "Ronjack", "category": "Gate", "code": "RJALUGATE1800", "name": "Gate Frame Kit", "colour": "", "size": "1800 x 900mm", "weight": 66, "unit": 393.75, "rrp": 551.25}, {"supplier": "Ronjack", "category": "Garden Room", "code": "GRJANAPEX", "name": "Janssen Garden Room Apex Roof", "colour": "", "size": "2.95 x 2.95m", "weight": 680, "unit": 2289.0, "rrp": 3204.0}, {"supplier": "Coodec", "category": "Acoustic", "code": "CWS01WG68", "name": "Acoustic Shadow Panel", "colour": "Grey", "size": "2400x600x21", "weight": 11.2, "unit": 25.0, "rrp": 35.0}, {"supplier": "Coodec", "category": "Acoustic", "code": "CWS01WG65", "name": "Acoustic Shadow Panel", "colour": "Black", "size": "2400x600x21", "weight": 11.2, "unit": 25.0, "rrp": 35.0}, {"supplier": "Coodec", "category": "Acoustic", "code": "CWS01WG19", "name": "Acoustic Shadow Panel", "colour": "Walnut", "size": "2400x600x21", "weight": 11.2, "unit": 25.0, "rrp": 35.0}, {"supplier": "Coodec", "category": "Fluted", "code": "CWB250-WG19", "name": "WPC Fluted Panel", "colour": "Walnut", "size": "2400x250x10", "weight": 2.5, "unit": 5.52, "rrp": 7.73}, {"supplier": "Coodec", "category": "Fluted", "code": "CWB158-WG68", "name": "WPC Fluted Panel", "colour": "Grey", "size": "2400x158x10", "weight": 1.37, "unit": 3.96, "rrp": 5.54}, {"supplier": "Coodec", "category": "Trim & Fixings", "code": "DE10-WG68", "name": "WPC Trim for Coodec", "colour": "Grey", "size": "2400x25x25", "weight": 0.33, "unit": 6.5, "rrp": 9.1}, {"supplier": "Coodec", "category": "Trim & Fixings", "code": "AC04-AC04", "name": "Hidden Fixing for Coodec Stainless Steel", "colour": "Steel", "size": "45x35", "weight": 0.05, "unit": 0.4, "rrp": 0.56}];
let lines = JSON.parse(localStorage.getItem("cicLines")||"[]");
function money(n){return new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP"}).format(Number(n)||0)}
function quoteNo(){let y=new Date().getFullYear(),k="cicSeq-"+y,c=localStorage.getItem("cicCurrent");if(c)return c;let n=Number(localStorage.getItem(k)||"0")+1;localStorage.setItem(k,n);c="CIC-"+y+"-"+String(n).padStart(4,"0");localStorage.setItem("cicCurrent",c);return c}
function carriage(w){if(w>=1000)return 0;if(w>=617)return 110;if(w>=386)return 145;if(w>0)return 185;return 0}
function init(){document.getElementById("quoteNo").textContent=quoteNo();document.getElementById("date").textContent=new Date().toLocaleDateString("en-GB");["supplier","category"].forEach(id=>{let field=id==="supplier"?"supplier":"category";let vals=["All",...new Set(PRODUCTS.map(p=>p[field]))].sort();document.getElementById(id).innerHTML=vals.map(v=>`<option>${v}</option>`).join("")});renderProducts();renderQuote()}
function renderProducts(){let q=document.getElementById("search").value.toLowerCase(),s=document.getElementById("supplier").value,c=document.getElementById("category").value;let rows=PRODUCTS.filter(p=>(s==="All"||p.supplier===s)&&(c==="All"||p.category===c)&&`${p.code} ${p.name} ${p.colour} ${p.size}`.toLowerCase().includes(q)).map(p=>`<tr><td class="code">${p.code}</td><td><b>${p.name}</b><div class="muted">${p.colour||""} ${p.size||""} · ${p.weight||0}kg</div></td><td>${money(p.unit)}</td><td>${money(p.rrp)}</td><td><button onclick="addLine('${p.code}')">Add</button></td></tr>`).join("");document.getElementById("productRows").innerHTML=rows||"<tr><td colspan=5>No products found.</td></tr>"}
function addLine(code){let p=PRODUCTS.find(x=>x.code===code),sell=document.getElementById("useRrp").checked?p.rrp:p.unit;let f=lines.find(l=>l.code===code&&l.sell===sell);if(f)f.qty++;else lines.push({...p,qty:1,sell});save()}
function save(){localStorage.setItem("cicLines",JSON.stringify(lines));renderQuote()}
function upd(i,f,v){lines[i][f]=f==="qty"?Math.max(1,Number(v)||1):Number(v)||0;save()}
function rem(i){lines.splice(i,1);save()}
function renderQuote(){document.getElementById("quoteRows").innerHTML=lines.map((l,i)=>`<tr><td><b>${l.code}</b> · ${l.name}<div class="muted">${l.colour||""} ${l.size||""}</div></td><td><input class="qty" type="number" min="1" value="${l.qty}" onchange="upd(${i},'qty',this.value)"></td><td><input class="price" type="number" step="0.01" value="${l.sell}" onchange="upd(${i},'sell',this.value)"></td><td style="text-align:right">${money(l.qty*l.sell)}</td><td class="noPrint"><button class="red" onclick="rem(${i})">X</button></td></tr>`).join("")||"<tr><td colspan=5 class='muted'>Select items from the product list.</td></tr>";let sub=lines.reduce((s,l)=>s+l.qty*l.sell,0),w=lines.reduce((s,l)=>s+l.qty*(l.weight||0),0),del=document.getElementById("autoDelivery").checked?carriage(w):0,net=sub+del,vat=document.getElementById("vat").checked?net*.2:0,total=net+vat;document.getElementById("totals").innerHTML=`<div><span>Total weight</span><b>${w.toFixed(2)} kg</b></div><div><span>Items subtotal</span><b>${money(sub)}</b></div><div><span>Carriage</span><b>${money(del)}</b></div><div><span>VAT</span><b>${money(vat)}</b></div><div class="total"><span>Total</span><b>${money(total)}</b></div>`}
function newQuote(){if(!confirm("Start a new quote?"))return;lines=[];localStorage.removeItem("cicLines");localStorage.removeItem("cicCurrent");document.getElementById("quoteNo").textContent=quoteNo();document.getElementById("customer").value="";renderQuote()}
init();
</script></body></html>
